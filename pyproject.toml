[project]
name = "mvp"
version = "0.1.0"
description = "MVP scaffold"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
addopts = "-q --cov=mvp --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
