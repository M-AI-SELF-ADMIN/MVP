name: Publish Python package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.version.outputs.version }}
      has-testpypi-token: ${{ steps.secrets.outputs.has_testpypi_token }}
      has-pypi-token: ${{ steps.secrets.outputs.has_pypi_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Validate built artifacts
        run: twine check dist/*

      - name: Read project version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          print(f"version={version}")
          PY

      - name: Verify tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          test "${GITHUB_REF_NAME#v}" = "${PROJECT_VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${PROJECT_VERSION}" >&2
            exit 1
          }
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}

      - name: Detect publish secrets
        id: secrets
        run: |
          if [ -n "$TEST_PYPI_API_TOKEN" ]; then
            echo "has_testpypi_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_testpypi_token=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "has_pypi_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pypi_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: |
      needs.build.outputs.has-testpypi-token == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'))
    environment: testpypi
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: |
      needs.build.outputs.has-pypi-token == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'))
    environment: pypi
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-skipped:
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.build.outputs.has-pypi-token == 'false' && needs.build.outputs.has-testpypi-token == 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' && needs.build.outputs.has-testpypi-token == 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi' && needs.build.outputs.has-pypi-token == 'false')
    steps:
      - name: Report skipped publish
        run: echo "Publishing skipped because the required secret is not configured."
