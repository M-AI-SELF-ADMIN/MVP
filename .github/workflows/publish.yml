name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Validate built artifacts
        run: twine check dist/*

      - name: Capture version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pyproject version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          pyproject_version = data['project']['version']
          import os
          tag_version = os.environ['TAG_VERSION']
          if pyproject_version != tag_version:
              raise SystemExit(
                  f"Version mismatch: pyproject={pyproject_version}, tag={tag_version}"
              )
          print(f"Version OK: {pyproject_version}")
          PY
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.TEST_PYPI_API_TOKEN != '' }}
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.PYPI_API_TOKEN != '' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-skipped:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.PYPI_API_TOKEN == '' && secrets.TEST_PYPI_API_TOKEN == '' }}
    steps:
      - name: No publish secrets configured
        run: echo "No publish secrets set; build validation completed and upload skipped."
