name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src tests

      - name: Test (pytest + coverage)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Add coverage to job summary
        run: |
          {
            echo "## Coverage summary (Python ${{ matrix.python-version }})"
            echo
            pytest --cov=src --cov-report=term --cov-report= >/tmp/coverage.txt
            sed -n '/^Name/,/^TOTAL/p' /tmp/coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
