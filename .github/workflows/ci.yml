name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov ruff mypy

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Run pytest with coverage
        run: pytest --cov=mvp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Add coverage summary to job summary
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          coverage_file = pathlib.Path("coverage.xml")
          summary_path = pathlib.Path("$GITHUB_STEP_SUMMARY")

          if not coverage_file.exists():
              summary_path.write_text("## Coverage Summary\n\nCoverage report was not generated.\n", encoding="utf-8")
              raise SystemExit(0)

          root = ET.parse(coverage_file).getroot()
          line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100
          lines_covered = int(root.attrib.get("lines-covered", 0))
          lines_valid = int(root.attrib.get("lines-valid", 0))

          summary = (
              "## Coverage Summary\n\n"
              f"- **Line coverage:** {line_rate:.2f}% ({lines_covered}/{lines_valid})\n"
              f"- **Branch coverage:** {branch_rate:.2f}%\n"
          )

          with summary_path.open("a", encoding="utf-8") as fh:
              fh.write(summary)
          PY
          pip install -e .
          pip install pytest pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src tests

      - name: Test (pytest + coverage)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Add coverage to job summary
        run: |
          {
            echo "## Coverage summary (Python ${{ matrix.python-version }})"
            echo
            pytest --cov=src --cov-report=term --cov-report= >/tmp/coverage.txt
            sed -n '/^Name/,/^TOTAL/p' /tmp/coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
