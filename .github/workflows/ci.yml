name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests with coverage
        run: pytest --cov=mvp --cov-report=term-missing --cov-report=xml

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src tests

      - name: Publish coverage summary
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import pathlib
          import xml.etree.ElementTree as ET

          coverage_file = pathlib.Path("coverage.xml")
          summary_file = pathlib.Path.cwd() / "coverage-summary.md"

          if not coverage_file.exists():
              summary_file.write_text(
                  "## Coverage Summary\n\nCoverage report was not generated.\n",
                  encoding="utf-8",
              )
          else:
              root = ET.parse(coverage_file).getroot()
              line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
              branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100
              lines_covered = int(root.attrib.get("lines-covered", 0))
              lines_valid = int(root.attrib.get("lines-valid", 0))
              summary_file.write_text(
                  "## Coverage Summary\n\n"
                  f"- Python: ${{ matrix.python-version }}\n"
                  f"- Line coverage: {line_rate:.2f}% ({lines_covered}/{lines_valid})\n"
                  f"- Branch coverage: {branch_rate:.2f}%\n",
                  encoding="utf-8",
              )

          with pathlib.Path("$GITHUB_STEP_SUMMARY").open("a", encoding="utf-8") as fh:
              fh.write(summary_file.read_text(encoding="utf-8"))
          PY

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage-summary.md
          if-no-files-found: error
